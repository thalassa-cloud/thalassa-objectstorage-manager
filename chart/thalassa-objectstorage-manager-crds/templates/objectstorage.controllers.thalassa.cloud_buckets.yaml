---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: buckets.objectstorage.controllers.thalassa.cloud
spec:
  group: objectstorage.controllers.thalassa.cloud
  names:
    kind: Bucket
    listKind: BucketList
    plural: buckets
    singular: bucket
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.bucketName
      name: Bucket
      type: string
    - jsonPath: .status.region
      name: Region
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Bucket is the Schema for Thalassa object storage buckets.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BucketSpec defines the desired state of a Thalassa object
              storage bucket.
            properties:
              generateNameSuffix:
                default: true
                description: |-
                  GenerateNameSuffix appends a short random suffix to the bucket name on create so repeated
                  applies get unique Thalassa bucket names. Defaults to true. Set to false for a fixed name
                  (required for deterministic naming / adoption by exact name).
                type: boolean
              metadata:
                description: |-
                  Metadata allows optional name and label overrides for the resource in Thalassa.
                  When metadata.name is set it is used as the bucket name (immutable after create).
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations are applied to the resource in Thalassa.
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: Labels are applied to the resource in Thalassa.
                    type: object
                  name:
                    description: Name overrides the name of the resource in Thalassa.
                      If not set, the Kubernetes object name is used.
                    type: string
                type: object
              name:
                description: |-
                  Name is the base Thalassa bucket name. If empty, metadata.name or the Kubernetes object name is used.
                  When generateNameSuffix is enabled (the default), a short random suffix is appended on create
                  (e.g. "app-data" → "app-data-a1b2c3"). The final name is recorded in status.bucketName.
                  Immutable after the bucket is created.
                type: string
                x-kubernetes-validations:
                - message: name is immutable
                  rule: self == oldSelf
              objectLockEnabled:
                description: ObjectLockEnabled enables object lock on the bucket.
                type: boolean
              policy:
                description: |-
                  Policy is an optional S3-compatible bucket policy as a JSON string.
                  BucketAccess-managed statements use a reserved Sid prefix and are merged by the BucketAccess controller.
                type: string
              public:
                description: Public controls whether the bucket allows public access.
                type: boolean
              region:
                description: |-
                  Region is the Thalassa cloud region identity or slug (immutable after create).
                  If empty, the manager uses --default-region.
                type: string
                x-kubernetes-validations:
                - message: region is immutable
                  rule: self == oldSelf
              versioning:
                default: Disabled
                description: Versioning is the bucket versioning mode.
                enum:
                - Disabled
                - Enabled
                - Suspended
                type: string
            type: object
          status:
            description: BucketStatus defines the observed state of Bucket.
            properties:
              bucketName:
                description: BucketName is the Thalassa bucket name used for API calls.
                type: string
              conditions:
                description: Conditions represent the current state of the Bucket.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Endpoint is the S3-compatible endpoint URL for the bucket.
                type: string
              lastReconcileError:
                description: LastReconcileError is the last error message from reconcile,
                  if any. Cleared on success.
                type: string
              lastReconcileTime:
                description: LastReconcileTime is when the controller last reconciled
                  this resource.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              region:
                description: Region is the resolved Thalassa region slug or identity.
                type: string
              resourceId:
                description: ResourceID is the Thalassa identity of the bucket.
                type: string
              resourceStatus:
                description: ResourceStatus is the status of the resource in Thalassa
                  (e.g. ready, pending).
                type: string
              usage:
                description: Usage is the observed usage of the bucket.
                properties:
                  totalObjects:
                    description: TotalObjects is the number of objects in the bucket.
                    format: int64
                    type: integer
                  totalSize:
                    anyOf:
                    - type: integer
                    - type: string
                    description: TotalSize is the total size of objects in the bucket.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
            type: object
        required:
