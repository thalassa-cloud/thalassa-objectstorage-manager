{{- /*
Namespaced Secret RBAC. Prefer this over cluster-wide Secrets access.
Always includes the release namespace; add tenant namespaces via rbac.secretNamespaces.
Skipped when rbac.clusterScopedSecrets (or allowAllNamespacesSecretRef) is true.
*/ -}}
{{- if ne (include "objectstorageManager.clusterScopedSecrets" .) "true" }}
{{- $namespaces := concat (list .Release.Namespace) (.Values.rbac.secretNamespaces | default list) | uniq }}
{{- range $ns := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "objectstorageManager.name" $ }}-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "objectstorageManager.labels" $ | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "objectstorageManager.name" $ }}-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "objectstorageManager.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "objectstorageManager.name" $ }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "objectstorageManager.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
