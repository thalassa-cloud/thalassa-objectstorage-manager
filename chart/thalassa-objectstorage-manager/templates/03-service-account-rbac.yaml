---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "objectstorageManager.name" . }}
rules:
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - objectstorage.controllers.thalassa.cloud
  resources:
  - buckets
  - bucketaccesses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - objectstorage.controllers.thalassa.cloud
  resources:
  - buckets/finalizers
  - bucketaccesses/finalizers
  verbs:
  - update
- apiGroups:
  - objectstorage.controllers.thalassa.cloud
  resources:
  - buckets/status
  - bucketaccesses/status
  verbs:
  - get
  - patch
  - update
{{- if eq (include "objectstorageManager.clusterScopedSecrets" .) "true" }}
# SECURITY-SENSITIVE: cluster-wide Secret access is only granted when
# rbac.clusterScopedSecrets (or allowAllNamespacesSecretRef) is explicitly enabled.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "objectstorageManager.name" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "objectstorageManager.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "objectstorageManager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
