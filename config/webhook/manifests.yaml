---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-objectstorage-controllers-thalassa-cloud-v1-bucket
  failurePolicy: Fail
  name: vbucket-v1.kb.io
  rules:
  - apiGroups:
    - objectstorage.controllers.thalassa.cloud
    apiVersions:
    - v1
    operations:
    - DELETE
    resources:
    - buckets
  sideEffects: None
