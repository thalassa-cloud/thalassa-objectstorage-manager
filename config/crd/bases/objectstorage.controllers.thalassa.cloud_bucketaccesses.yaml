---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: bucketaccesses.objectstorage.controllers.thalassa.cloud
spec:
  group: objectstorage.controllers.thalassa.cloud
  names:
    kind: BucketAccess
    listKind: BucketAccessList
    plural: bucketaccesses
    singular: bucketaccess
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.principalArn
      name: Principal
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.secretRef.name
      name: Secret
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: BucketAccess provisions Thalassa IAM credentials and/or bucket
          policy grants for S3 access.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BucketAccessSpec defines the desired state of BucketAccess.

              Two modes:
                - Managed (default): create a Thalassa IAM service account + object-storage credentials,
                  grant that principal on referenced buckets, and write S3 credentials into a Secret.
                  Requires writeSecretToRef; principalRef must be unset.
                - External principal: grant an existing User or ServiceAccount on referenced buckets only.
                  Requires principalRef; writeSecretToRef must be unset. No credentials are created or deleted.
            properties:
              bucketRefs:
                description: BucketRefs references one or more Bucket resources in
                  the same namespace.
                items:
                  description: LocalObjectReference contains enough information to
                    let you locate a namespaced object.
                  properties:
                    name:
                      description: Name of the referent.
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
              description:
                description: Description is an optional description for the Thalassa
                  IAM service account (managed mode only).
                type: string
              expiresAt:
                description: ExpiresAt is an optional expiration timestamp for the
                  access credential (managed mode only).
                format: date-time
                type: string
              metadata:
                description: Metadata allows optional labels/annotations on the Thalassa
                  IAM service account (managed mode only).
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations are applied to the resource in Thalassa.
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: Labels are applied to the resource in Thalassa.
                    type: object
                  name:
                    description: Name overrides the name of the resource in Thalassa.
                      If not set, the Kubernetes object name is used.
                    type: string
                type: object
              permissionPreset:
                default: ReadWrite
                description: |-
                  PermissionPreset selects a built-in S3 action set when Permissions is empty.
                  ReadOnly = get/list objects; ReadWrite = default object read/write + list (recommended default).
                  Ignored when Permissions is non-empty.
                enum:
                - ReadOnly
                - ReadWrite
                type: string
              permissions:
                description: |-
                  Permissions is an explicit list of S3 actions for the managed bucket policy statement.
                  Each action must be allowlisted by the controller (admin actions like s3:*, DeleteBucket,
                  PutBucketPolicy are rejected). When empty, PermissionPreset is used.
                items:
                  type: string
                type: array
              principalRef:
                description: |-
                  PrincipalRef references an existing Thalassa IAM User or ServiceAccount (external mode).
                  When set, the controller only upserts a managed bucket policy statement for that principal.
                  Required when writeSecretToRef is unset; must be omitted in managed mode.
                properties:
                  identity:
                    description: |-
                      Identity is the Thalassa identity of the principal (e.g. u-... for users, sa-... for service accounts).
                      For users this is typically the AppUser subject.
                    minLength: 1
                    type: string
                  kind:
                    description: Kind is the Thalassa IAM principal kind.
                    enum:
                    - User
                    - ServiceAccount
                    type: string
                required:
                - identity
                - kind
                type: object
              serviceAccountName:
                description: |-
                  ServiceAccountName overrides the Thalassa IAM service account name (managed mode only).
                  Defaults to "<namespace>-<name>" of this BucketAccess. Ignored when principalRef is set.
                type: string
              writeSecretToRef:
                description: |-
                  WriteSecretToRef is the Secret that will receive access credentials (managed mode).
                  Keys written: accessKey, secretKey, endpoint, bucket (primary), buckets (comma-separated).
                  Required when principalRef is unset; must be omitted when principalRef is set.
                properties:
                  name:
                    description: Name is the name of the Secret.
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the Secret. Defaults to the same namespace as the referencing resource.
                      Cross-namespace refs require the manager flag --allow-all-namespaces-secret-ref.
                    type: string
                required:
                - name
                type: object
            required:
            - bucketRefs
            type: object
            x-kubernetes-validations:
            - message: exactly one of principalRef or writeSecretToRef must be set
              rule: has(self.principalRef) != has(self.writeSecretToRef)
          status:
            description: BucketAccessStatus defines the observed state of BucketAccess.
            properties:
              accessCredentialId:
                description: AccessCredentialID is the Thalassa identity of the access
                  credential (managed mode only).
                type: string
              accessKeyId:
                description: AccessKeyID is the non-secret access key identifier (never
                  the secret; managed mode only).
                type: string
              appliedPermissions:
                description: AppliedPermissions is the resolved S3 action list last
                  applied to bucket policies.
                items:
                  type: string
                type: array
              conditions:
                description: Conditions represent the current state of the BucketAccess.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              grantedBuckets:
                description: GrantedBuckets lists Thalassa bucket names that currently
                  have the managed policy grant.
                items:
                  type: string
                type: array
              lastCredentialRotationTime:
                description: LastCredentialRotationTime is when credentials were last
                  created or rotated (managed mode only).
                format: date-time
                type: string
              lastReconcileError:
                description: LastReconcileError is the last error message from reconcile,
                  if any. Cleared on success.
                type: string
              lastReconcileTime:
                description: LastReconcileTime is when the controller last reconciled
                  this resource.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              principalArn:
                description: PrincipalARN is the Thalassa IAM principal ARN last applied
                  to bucket policies.
                type: string
              resourceStatus:
                description: ResourceStatus is the status of the resource in Thalassa
                  (e.g. ready, pending).
                type: string
              secretRef:
                description: SecretRef names the Secret that holds credentials (managed
                  mode only).
                properties:
                  name:
                    description: Name is the name of the Secret.
                    type: string
                  namespace:
                    description: |-
                      Namespace is the namespace of the Secret. Defaults to the same namespace as the referencing resource.
                      Cross-namespace refs require the manager flag --allow-all-namespaces-secret-ref.
                    type: string
                required:
                - name
                type: object
              serviceAccountId:
                description: |-
                  ServiceAccountID is the Thalassa identity of the IAM service account
                  (managed SA, or the referenced ServiceAccount in external mode).
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
