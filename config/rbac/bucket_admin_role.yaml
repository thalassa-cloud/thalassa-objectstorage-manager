# This rule is not used by the project thalassa-objectstorage-manager itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over objectstorage.controllers.thalassa.cloud.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: thalassa-objectstorage-manager
    app.kubernetes.io/managed-by: kustomize
  name: bucket-admin-role
rules:
- apiGroups:
  - objectstorage.controllers.thalassa.cloud
  resources:
  - buckets
  verbs:
  - '*'
- apiGroups:
  - objectstorage.controllers.thalassa.cloud
  resources:
  - buckets/status
  verbs:
  - get
