# Cluster-wide Secrets access for make deploy / local kustomize.
# Production Helm installs use namespaced Role/RoleBinding instead
# (see chart/.../templates/07-secret-rbac.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-secrets-role
  labels:
    app.kubernetes.io/name: thalassa-objectstorage-manager
    app.kubernetes.io/component: rbac
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager-secrets-rolebinding
  labels:
    app.kubernetes.io/name: thalassa-objectstorage-manager
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-secrets-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
